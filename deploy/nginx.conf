# Configuration Nginx — Masjid Al Nour
# À copier vers /etc/nginx/sites-available/masjid puis lier avec :
#   sudo ln -s /etc/nginx/sites-available/masjid /etc/nginx/sites-enabled/
#
# Remplace TOUTES les occurrences de votredomaine.com par ton vrai nom de domaine
# avant de copier ce fichier sur le serveur.
#
# Ce fichier est volontairement en HTTP simple : c'est Certbot (voir DEPLOYMENT.md)
# qui va automatiquement le modifier pour ajouter le HTTPS. Ne configure pas le SSL
# à la main ici.

server {
    listen 80;
    listen [::]:80;
    server_name votredomaine.com www.votredomaine.com;

    # ── Frontend (fichiers statiques générés par "npm run build") ──
    root /var/www/masjid/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API backend (NestJS, tourne en interne sur le port 3000) ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Fichiers audio téléversés (annonces vocales) ──
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Taille max des fichiers audio uploadés (doit correspondre à la limite du backend, 20 Mo)
    client_max_body_size 20M;
}
